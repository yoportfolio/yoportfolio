<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>金魚</title><link rel="stylesheet" href="style.css?v=caught-layout-24"></head>
<body><main><div class="game"><section id="stage" aria-label="金魚すくいの水槽"><div id="opening" aria-label="オープニング"><img id="opening-title" src="assets/opening-title.jpg" alt="金魚"><img id="opening-tank" src="assets/opening-tank.png" alt="金魚すくいの水槽" hidden><div id="opening-characters" hidden><img id="opening-net" src="assets/senior-net.png" alt="先輩金魚をすくうポイ" hidden><img id="senior-fish" src="assets/senior-fish-opening.png" alt="先輩金魚"><div id="opening-speech" hidden><img src="assets/speech-bubble.png" alt=""><p><span>目が覚めたか？<br>ここは金魚すくいの水槽…<br>左右キーでポイを避けな！<br>絶対に捕まんなよ</span></p></div></div><div id="opening-white"></div></div><div id="ending" aria-label="エンディング" hidden><img id="ending-tank" src="assets/ending-tank.png" alt="新しい水槽"><div id="ending-characters"><img id="ending-senior" src="assets/senior-fish.png" alt="先輩金魚"><div id="ending-speech"><img src="assets/speech-bubble.png" alt=""><p><span>よう！久しぶりだな</span></p></div></div><p id="ending-message" role="status" hidden>あなたは水槽で余生を全うした</p><div id="ending-white"></div><button id="ending-retry" hidden>もう一度</button></div><div id="water"></div><div id="middle-fish" aria-hidden="true"><img id="drifting-fish" src="assets/middle-fish.png" alt=""></div><div id="foreground"></div><div id="nets"></div><img id="fish" src="assets/player.png" alt="あなたの金魚"><img id="food" src="assets/food.png" alt="餌" hidden><img id="hunger" src="assets/hunger.png" alt="" hidden><p id="day-label" role="status" hidden></p><div id="day-transition" hidden><p id="day-message" role="status"></p></div><div id="capture" hidden aria-hidden="true"><img id="capture-net" alt=""><img id="capture-fish" src="assets/player.png" alt=""><div id="capture-white"></div></div><div id="result" hidden><img id="caught-image" src="assets/caught.png" alt="袋に入った金魚"><p id="resultText" role="status"></p><button id="retry">もう一度</button></div><div id="scene-fade" hidden aria-hidden="true"></div><button id="resume" hidden>再開</button></section><nav aria-label="泳ぐ方向"><button id="left" aria-label="左に泳ぐ">◀</button><button id="right" aria-label="右に泳ぐ">▶</button></nav></div></main><script src="collision-masks.js"></script><script src="script.js?v=caught-layout-24"></script></body></html>
